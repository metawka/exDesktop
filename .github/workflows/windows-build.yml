name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # prepare.py expects the checkout to be a folder literally named
      # "tdesktop" sitting right next to Libraries/ThirdParty, same deal
      # as the macOS workflow.
      - name: Link checkout as tdesktop
        shell: cmd
        run: mklink /J "%GITHUB_WORKSPACE%\..\tdesktop" "%GITHUB_WORKSPACE%"

      - name: Cache ThirdParty libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\..\Libraries
            ${{ github.workspace }}\..\ThirdParty
          key: win-libs-${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/prepare/win.bat') }}

      - name: Install ATL for Breakpad
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsPath) { throw "Visual Studio installation not found" }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          & $installer modify --installPath $vsPath --add Microsoft.VisualStudio.Component.VC.ATL --quiet --wait --norestart
          if ($LASTEXITCODE -ne 0) { throw "Failed to install ATL (exit code $LASTEXITCODE)" }
          if (-not (Get-ChildItem "$vsPath\VC\Tools\MSVC" -Filter atlbase.h -Recurse -ErrorAction SilentlyContinue)) {
            throw "ATL headers still missing after installation"
          }

      - name: Build ThirdParty libraries
        shell: cmd
        run: Telegram\build\prepare\win.bat silent

      # Plugin engine links against an embedded Python 3.11, expected at
      # Libraries/win64/python311 with include/, libs/python311.lib and embed/.
      - name: Fetch embedded Python 3.11
        shell: pwsh
        run: |
          $dest = Join-Path (Split-Path $env:GITHUB_WORKSPACE) "Libraries\win64\python311"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" -OutFile embed.zip
          Expand-Archive embed.zip "$dest\embed" -Force
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/python/3.11.9" -OutFile python.nupkg.zip
          Expand-Archive python.nupkg.zip nuget -Force
          Copy-Item nuget\tools\include "$dest\include" -Recurse -Force
          Copy-Item nuget\tools\libs "$dest\libs" -Recurse -Force

      - name: Find vcvars64.bat
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          echo "VCVARS64=$vsPath\VC\Auxiliary\Build\vcvars64.bat" >> $env:GITHUB_ENV

      # -vcvars_ver=14.44 is what docs/building-win.md pins for Windows 7
      # support. If a runner's VS install doesn't ship that exact toolset
      # this will fail and needs adjusting to whatever is actually there.
      - name: Configure and build
        shell: cmd
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          call "%VCVARS64%" -vcvars_ver=14.44
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=%API_ID% -D TDESKTOP_API_HASH=%API_HASH%
          cd ..
          cmake --build out --config Release --target Telegram

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item out\Release\Telegram.exe pkg\
          Copy-Item out\Release\python pkg\python -Recurse
          Compress-Archive -Path pkg\* -DestinationPath exteraDesktop-windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: exteraDesktop-windows-x64
          path: exteraDesktop-windows-x64.zip

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" "exteraDesktop-windows-x64.zip"
