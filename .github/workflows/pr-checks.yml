name: PR checks

on:
  pull_request:
    paths-ignore:
      - 'badges.json'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.workflows == 'true' || steps.filter.outputs.preparepy == 'true' || steps.filter.outputs.shell == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            preparepy:
              - 'Telegram/build/prepare/prepare.py'
            shell:
              - 'Telegram/build/prepare/**/*.sh'

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Same hooks as .pre-commit-config.yaml, so CI and local `git commit`
      # agree: trailing whitespace, shfmt, shellcheck, actionlint, etc.,
      # all scoped to .github/ and Telegram/build/prepare/ only.
      - uses: pre-commit/action@v3.0.1
