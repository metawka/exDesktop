name: macOS build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360
    env:
      CLEAR_QT_BUILD_TREE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop

      - name: Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"

      - name: Patch tgcalls CryptoHelper.h for C++ linkage
        run: python3 tdesktop/.github/patches/fix_tgcalls_crypto.py

      - name: Install build dependencies
        run: brew install automake libtool cmake wget pkg-config gnu-tar ninja nasm meson

      - name: Restore ThirdParty libraries
        id: libs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/Libraries
            ${{ github.workspace }}/ThirdParty
          key: mac-libs-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py', 'tdesktop/Telegram/build/prepare/mac.sh') }}
          restore-keys: |
            mac-libs-

      - name: Build ThirdParty libraries
        env:
          # fetch_archive.py queries the GitHub API, unauthenticated it hits the rate limit.
          GH_TOKEN: ${{ github.token }}
        run: ./tdesktop/Telegram/build/prepare/mac.sh silent

      - name: Save ThirdParty libraries
        if: steps.libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/Libraries
            ${{ github.workspace }}/ThirdParty
          key: ${{ steps.libs.outputs.cache-primary-key }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mac-arm64
          max-size: 2G

      # Xcode generator builds the app far too slowly on the runner (6 h
      # timeout was hit), Ninja + ccache keeps it within limits.
      - name: Configure
        working-directory: tdesktop/Telegram
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -n "$API_ID" ]; then
            creds=(-D TDESKTOP_API_ID="$API_ID" -D TDESKTOP_API_HASH="$API_HASH")
          elif [ "$GITHUB_EVENT_NAME" = release ]; then
            echo "TDESKTOP_API_ID secret is not set"; exit 1
          else
            echo "No API secrets, using TEST ONLY credentials"
            creds=(-D TDESKTOP_API_TEST=ON)
          fi
          ./configure.sh "${creds[@]}" \
            -G "Ninja Multi-Config" \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D CMAKE_OBJC_COMPILER_LAUNCHER=ccache \
            -D CMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_FLAGS="-Xclang -fno-pch-timestamp" \
            -D CMAKE_OBJCXX_FLAGS="-Xclang -fno-pch-timestamp"

      # Most sources use the precompiled header, which ccache refuses to cache
      # unless the PCH has no timestamp and these sloppiness bits are set.
      # Three jobs, not ninja's default five: the 3-core/7 GB runner swaps and
      # single files took 10-20 min.
      - name: Build
        working-directory: tdesktop/out
        env:
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
        run: cmake --build . --config Release --target Telegram --parallel 3

      - name: Package
        working-directory: tdesktop/out/Release
        run: |
          # No Developer ID yet: sign ad-hoc so the bundle is at least
          # consistently signed. Without it Gatekeeper reports a downloaded
          # arm64 app as "damaged" instead of from an unidentified developer.
          codesign --force --deep --sign - Telegram.app
          codesign --verify --deep --strict Telegram.app
          ditto -c -k --sequesterRsrc --keepParent Telegram.app \
            "$GITHUB_WORKSPACE/exteraDesktop-macos-arm64.zip"

      - name: Build DMG
        working-directory: tdesktop/out/Release
        run: |
          STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE_DIR"
          ditto Telegram.app "$STAGE_DIR/exteraDesktop.app"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create \
            -volname "exteraDesktop" \
            -srcfolder "$STAGE_DIR" \
            -fs HFS+ \
            -fsargs "-c c=64,a=16,e=16" \
            -format UDZO \
            -imagekey zlib-level=9 \
            "$GITHUB_WORKSPACE/exteraDesktop-macos-arm64.dmg"
          codesign --force --sign - "$GITHUB_WORKSPACE/exteraDesktop-macos-arm64.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: exteraDesktop-macos-arm64
          path: |
            exteraDesktop-macos-arm64.zip
            exteraDesktop-macos-arm64.dmg

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "exteraDesktop-macos-arm64.zip" \
            "exteraDesktop-macos-arm64.dmg"
