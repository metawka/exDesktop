name: PR checks

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint workflow files
        uses: raven-actions/actionlint@v2

      - name: Check prepare.py syntax
        run: python3 -m py_compile Telegram/build/prepare/prepare.py

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck build scripts
        run: find Telegram/build/prepare -name '*.sh' -print0 | xargs -0 -r shellcheck -S error
