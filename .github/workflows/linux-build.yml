name: Linux build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Rocky Linux 8
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: exdesktop:centos_env

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate Dockerfile
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Libraries cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.os }}-libs-

      - name: Libraries
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Build
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "TDESKTOP_API_ID or TDESKTOP_API_HASH secret is not set"
            exit 1
          fi
          mkdir -p "${{ runner.temp }}/ccache"
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -v "${{ runner.temp }}/ccache:/var/cache/ccache" \
            -e CCACHE_DIR=/var/cache/ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime \
            -e CONFIG=Release \
            -e API_ID -e API_HASH \
            "$IMAGE_TAG" \
            bash -c '/usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -D CMAKE_CONFIGURATION_TYPES=Release \
              -D TDESKTOP_API_ID="$API_ID" \
              -D TDESKTOP_API_HASH="$API_HASH" \
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
              -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON'
          test -f out/Release/Telegram

      - name: Python packages
        run: |
          python3 -m pip install --disable-pip-version-check --target pkgdeps/site-packages \
            --platform manylinux2014_x86_64 --python-version 3.11 --implementation cp --abi cp311 --abi abi3 --abi none \
            --only-binary=:all: requests beautifulsoup4 lxml pillow PyYAML packaging
          python3 -m pip install --disable-pip-version-check --target pkgdeps/tools patchelf

      - name: Package
        run: |
          VERSION=$(sed -n 's/.*AppVersionStr = "\([^"]*\)".*/\1/p' Telegram/SourceFiles/core/version.h)
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -e VERSION="$VERSION" \
            "$IMAGE_TAG" \
            bash -euo pipefail -c '
              cd /usr/src/tdesktop
              PKG="pkg/exDesktop"
              rm -rf pkg
              mkdir -p "$PKG/lib" "$PKG/python" "$PKG/python311/lib"
              cp out/Release/Telegram "$PKG/exDesktop-bin"
              cp Telegram/Resources/art/icon256.png "$PKG/exDesktop.png"
              strip "$PKG/exDesktop-bin"
              cp -L /usr/lib64/libpython3.11.so.1.0 "$PKG/lib/"
              cp -r /usr/lib64/python3.11 "$PKG/python311/lib/python3.11"
              rm -rf "$PKG/python311/lib/python3.11/test" \
                "$PKG/python311/lib/python3.11/site-packages"
              find "$PKG/python311" -name "__pycache__" -type d -prune -exec rm -rf {} +
              ln -s lib "$PKG/python311/lib64"
              for so in "$PKG"/python311/lib/python3.11/lib-dynload/*.so "$PKG"/lib/libpython3.11.so.1.0; do
                ldd "$so" | grep -o "=> /[^ ]*" | cut -c4-
              done | sort -u                 | grep -v -E "/(libc|libm|libpthread|libdl|librt|libutil|ld-linux[^/]*)\.so"                 | while read -r dep; do cp -Ln "$dep" "$PKG/lib/" || true; done
              mkdir -p "$PKG/python/extera" "$PKG/python/site-packages" "$PKG/python/tgws"
              cp -r Telegram/SourceFiles/extera/python/. "$PKG/python/extera/"
              cp -r pkgdeps/site-packages/. "$PKG/python/site-packages/"
              cp -r Telegram/SourceFiles/extera/tgws/. "$PKG/python/tgws/"
              find "$PKG/python" -name "__pycache__" -type d -prune -exec rm -rf {} +
              PATCHELF=$(find pkgdeps/tools -type f -name patchelf | head -1)
              if [ -n "$PATCHELF" ]; then
                chmod +x "$PATCHELF"
                "$PATCHELF" --set-rpath "\$ORIGIN/lib" "$PKG/exDesktop-bin"
              fi
              cat > "$PKG/exDesktop" <<SH
          #!/bin/sh
          SELF="\$(readlink -f "\$0" 2>/dev/null)"
          [ -n "\$SELF" ] || SELF="\$0"
          DIR="\$(cd "\$(dirname "\$SELF")" && pwd)"
          export LD_LIBRARY_PATH="\$DIR/lib\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}"
          export PYTHONHOME="\$DIR/python311"
          export PYTHONNOUSERSITE=1
          exec "\$DIR/exDesktop-bin" "\$@"
          SH
              chmod +x "$PKG/exDesktop" "$PKG/exDesktop-bin"
              PYTHONHOME="$PKG/python311" PYTHONNOUSERSITE=1 LD_LIBRARY_PATH="$PKG/lib" python3.11 -c "
          import sys
          sys.path[:0] = [\"$PKG/python/site-packages\", \"$PKG/python/extera\"]
          import ssl, sqlite3, lzma, bz2, ctypes, json, zlib, hashlib, asyncio
          import requests, lxml.etree, PIL.Image, yaml, bs4, packaging
          print(\"plugin runtime ok\", sys.prefix)
          "
              tar -C pkg -czf "exDesktop-linux-x64.$VERSION.tar.gz" exDesktop
            '
          ls -la "exDesktop-linux-x64.$VERSION.tar.gz"

      # .moon is moon's single-file bundle (https://github.com/moonpkg/cli):
      # the same app as the tarball, plus a desktop entry and icon.
      - name: Install moon
        run: cargo install moon --locked

      - name: Build .moon bundle
        run: |
          TARBALL=$(find . -maxdepth 1 -name 'exDesktop-linux-x64.*.tar.gz' -print -quit)
          if [ -z "$TARBALL" ]; then
            echo "Linux tarball not found, cannot build the .moon bundle" >&2
            exit 1
          fi
          VERSION=$(basename "$TARBALL")
          VERSION="${VERSION#exDesktop-linux-x64.}"
          VERSION="${VERSION%.tar.gz}"
          BUNDLE_DIR="exDesktop-moon"
          BUNDLE="exDesktop-linux-x64.$VERSION.moon"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR/app" "$BUNDLE_DIR/desktop" "$BUNDLE_DIR/icon"
          tar -xzf "$TARBALL" -C "$BUNDLE_DIR/app" --strip-components=1
          cat > "$BUNDLE_DIR/exDesktop.manifest" <<MANIFEST
          dir=app
          main=app/exDesktop
          version=$VERSION
          desktop=desktop/exDesktop.desktop
          link=exDesktop
          to=app/exDesktop
          cmd=exDesktop
          MANIFEST
          cat > "$BUNDLE_DIR/desktop/exDesktop.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=exDesktop
          GenericName=Telegram Desktop
          Comment=Unofficial Telegram Desktop client
          TryExec=exDesktop
          Exec=exDesktop %U
          Icon=exDesktop
          Terminal=false
          Categories=Chat;Network;InstantMessaging;Qt;
          MimeType=x-scheme-handler/tg;x-scheme-handler/tonsite;x-scheme-handler/ton;
          Keywords=tg;chat;im;messaging;messenger;sms;tdesktop;
          StartupWMClass=TelegramDesktop
          SingleMainWindow=true
          X-GNOME-UsesNotifications=true
          X-GNOME-SingleWindow=true
          DESKTOP
          cp Telegram/Resources/art/exteradesktop.png "$BUNDLE_DIR/icon/exDesktop.png"
          moon bundle "$BUNDLE_DIR" "$BUNDLE" --force
          moon inspect "$BUNDLE"
          ls -la "$BUNDLE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exDesktop-linux-x64
          path: |
            exDesktop-linux-x64.*.tar.gz
            exDesktop-linux-x64.*.moon
          retention-days: 7

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "exDesktop-linux-x64.$VERSION.tar.gz" \
            "exDesktop-linux-x64.$VERSION.moon" --clobber
